server:
  port: 8095
  forward-headers-strategy: framework
spring:
  application:
    name: skyfleet-logistics-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:skyfleet_logistics}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:skyfleet}
    password: ${MYSQL_PASSWORD:skyfleet-local-password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
demo:
  cookie-secret: ${DEMO_COOKIE_SECRET:change-this-local-demo-cookie-secret}
  fleet:
    dev-pricing-enabled: ${FLEET_DEV_PRICING_ENABLED:false}
  max-active-sessions: ${DEMO_MAX_ACTIVE_SESSIONS:12}
  max-queue-size: ${DEMO_MAX_QUEUE_SIZE:100}
  session-duration-seconds: ${DEMO_SESSION_DURATION_SECONDS:180}
  disconnect-expiry-seconds: ${DEMO_DISCONNECT_EXPIRY_SECONDS:75}
  mqtt-url: ${MQTT_URL:tcp://localhost:1883}
  mqtt-client-id: ${MQTT_CLIENT_ID:skyfleet-logistics-backend}
mission:
  advanced-routing:
    technical-preview-enabled: ${ADVANCED_ROUTING_TECH_PREVIEW_ENABLED:false}
    tutorial-02-enabled: ${TUTORIAL_02_ENABLED:false}
    enabled: ${ADVANCED_ROUTING_ENABLED:false}
    click-merge-ms: 300
    minimum-request-interval-ms: 600
    requests-per-second: 2
    request-burst: 3
    road-snap-meters: 40
    maximum-extra-meters: 1500
    maximum-remaining-ratio: 1.6
    pace-head-start-seconds: 18
    mandatory-node-tolerance-meters: 30
    pointer-move-pixels: 6
    click-burst-window-ms: 2000
    click-burst-threshold: 5
    click-burst-suppression-ms: 10000
    candidate-maximum-length-ratio: 1.8
    candidate-maximum-overlap-rate: 0.85
    candidate-overlap-buffer-meters: 20
  routing:
    baidu:
      api-key: ${BAIDU_ROUTE_AK:}
      base-url: ${BAIDU_ROUTE_BASE_URL:https://api.map.baidu.com}
      connect-timeout-seconds: ${BAIDU_ROUTE_CONNECT_TIMEOUT_SECONDS:3}
      response-timeout-seconds: ${BAIDU_ROUTE_RESPONSE_TIMEOUT_SECONDS:6}
  traffic:
    simulation:
      spacing-meters: ${TRAFFIC_LIGHT_SPACING_METERS:360}
      stop-buffer-meters: ${TRAFFIC_LIGHT_STOP_BUFFER_METERS:10}
logging:
  level:
    com.skyfleet.logistics: INFO
