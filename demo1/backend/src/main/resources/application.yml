server:
  port: 8095
  forward-headers-strategy: framework
spring:
  application:
    name: zhixun-demo-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhixun_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:zhixun}
    password: ${MYSQL_PASSWORD:zhixun-local-password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
demo:
  cookie-secret: ${DEMO_COOKIE_SECRET:change-this-local-demo-cookie-secret}
  max-active-sessions: ${DEMO_MAX_ACTIVE_SESSIONS:12}
  max-queue-size: ${DEMO_MAX_QUEUE_SIZE:100}
  session-duration-seconds: ${DEMO_SESSION_DURATION_SECONDS:180}
  disconnect-expiry-seconds: ${DEMO_DISCONNECT_EXPIRY_SECONDS:75}
  mqtt-url: ${MQTT_URL:tcp://localhost:1883}
  mqtt-client-id: ${MQTT_CLIENT_ID:zhixun-demo-backend}
logging:
  level:
    com.zhixun.demo: INFO

