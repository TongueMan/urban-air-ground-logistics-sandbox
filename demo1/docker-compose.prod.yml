x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    mem_limit: 700m
    cpus: 0.45
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=80
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the production env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the production env file}
    logging: *production-logging
  mqtt:
    mem_limit: 96m
    cpus: 0.10
    logging: *production-logging
  backend:
    mem_limit: 900m
    cpus: 0.65
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx560m
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the production env file}
      DEMO_COOKIE_SECRET: ${DEMO_COOKIE_SECRET:?Set DEMO_COOKIE_SECRET in the production env file}
      DEMO_MAX_ACTIVE_SESSIONS: ${DEMO_MAX_ACTIVE_SESSIONS:-12}
      FLEET_DEV_PRICING_ENABLED: "false"
      ADVANCED_ROUTING_TECH_PREVIEW_ENABLED: ${ADVANCED_ROUTING_TECH_PREVIEW_ENABLED:-false}
      TUTORIAL_02_ENABLED: ${TUTORIAL_02_ENABLED:-false}
      ADVANCED_ROUTING_ENABLED: ${ADVANCED_ROUTING_ENABLED:-false}
    logging: *production-logging
  frontend:
    mem_limit: 128m
    cpus: 0.20
    environment:
      FRONTEND_BAIDU_MAP_AK: ${FRONTEND_BAIDU_MAP_AK:?Set FRONTEND_BAIDU_MAP_AK in the production env file}
    logging: *production-logging
