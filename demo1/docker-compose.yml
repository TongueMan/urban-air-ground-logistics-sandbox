name: skyfleet-logistics-sandbox

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skyfleet_logistics}
      MYSQL_USER: ${MYSQL_USER:-skyfleet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skyfleet-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-skyfleet-local-root-password}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    networks: [demo-net]

  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t skyfleet/health -m ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [demo-net]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skyfleet_logistics}
      MYSQL_USER: ${MYSQL_USER:-skyfleet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skyfleet-local-password}
      MQTT_URL: tcp://mqtt:1883
      DEMO_COOKIE_SECRET: ${DEMO_COOKIE_SECRET:-local-only-change-before-deploy-skyfleet}
      DEMO_MAX_ACTIVE_SESSIONS: ${DEMO_MAX_ACTIVE_SESSIONS:-12}
      DEMO_MAX_QUEUE_SIZE: ${DEMO_MAX_QUEUE_SIZE:-100}
      DEMO_SESSION_DURATION_SECONDS: ${DEMO_SESSION_DURATION_SECONDS:-180}
      DEMO_DISCONNECT_EXPIRY_SECONDS: ${DEMO_DISCONNECT_EXPIRY_SECONDS:-75}
      FLEET_DEV_PRICING_ENABLED: ${FLEET_DEV_PRICING_ENABLED:-true}
      TRAFFIC_LIGHT_SPACING_METERS: ${TRAFFIC_LIGHT_SPACING_METERS:-360}
      TRAFFIC_LIGHT_STOP_BUFFER_METERS: ${TRAFFIC_LIGHT_STOP_BUFFER_METERS:-10}
      BAIDU_ROUTE_AK: ${BAIDU_ROUTE_AK:-}
      BAIDU_ROUTE_BASE_URL: ${BAIDU_ROUTE_BASE_URL:-https://api.map.baidu.com}
      BAIDU_ROUTE_CONNECT_TIMEOUT_SECONDS: ${BAIDU_ROUTE_CONNECT_TIMEOUT_SECONDS:-3}
      BAIDU_ROUTE_RESPONSE_TIMEOUT_SECONDS: ${BAIDU_ROUTE_RESPONSE_TIMEOUT_SECONDS:-6}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8095/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    networks: [demo-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_BAIDU_MAP_AK: ${FRONTEND_BAIDU_MAP_AK:-}
      FRONTEND_STATIC_ASSET_BASE: ${FRONTEND_STATIC_ASSET_BASE:-https://java-tongueman.oss-cn-beijing.aliyuncs.com/%E5%9F%8E%E5%B8%82%E7%A9%BA%E5%9C%B0%E5%8D%8F%E5%90%8C%E7%89%A9%E6%B5%81%E8%BF%90%E8%90%A5%E6%B2%99%E7%9B%98}
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [demo-net]

networks:
  demo-net:
    driver: bridge

volumes:
  mysql-data:
  mqtt-data:
