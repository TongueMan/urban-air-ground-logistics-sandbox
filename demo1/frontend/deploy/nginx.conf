resolver 127.0.0.11 valid=10s ipv6=off;
upstream demo_backend { zone demo_backend 64k; server backend:8095 resolve; }
map $http_x_real_ip $skyfleet_real_ip { default $http_x_real_ip; "" $remote_addr; }
map $http_x_forwarded_proto $skyfleet_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /config.js { add_header Cache-Control 'no-store' always; alias /tmp/skyfleet-config.js; }
  location /api/ {
    proxy_pass http://demo_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $skyfleet_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $skyfleet_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 240s;
  }
  location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-store'; }
}
