resolver 127.0.0.11 valid=10s ipv6=off;
upstream demo_backend { zone demo_backend 64k; server backend:8095 resolve; }
upstream demo_media { zone demo_media 64k; server mediamtx:8889 resolve; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /config.js { add_header Cache-Control 'no-store' always; alias /tmp/skyfleet-config.js; }
  location /api/ {
    proxy_pass http://demo_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 240s;
  }
  location /media/ {
    proxy_pass http://demo_media/;
    proxy_redirect ~^/(.*)$ /media/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location /fallback-media/ {
    alias /usr/share/nginx/html/fallback-media/;
    add_header Cache-Control 'public, max-age=3600';
    types { video/mp4 mp4; }
  }
  location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-store'; }
}
