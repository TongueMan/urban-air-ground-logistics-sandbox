resolver 127.0.0.11 valid=10s ipv6=off;
upstream demo_backend { zone demo_backend 64k; server backend:8095 resolve; }
limit_req_zone $binary_remote_addr zone=skyfleet_page:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=skyfleet_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=skyfleet_per_ip:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  limit_req_status 429;
  limit_conn_status 429;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /config.js { add_header Cache-Control 'no-store' always; alias /tmp/skyfleet-config.js; }
  location /api/ {
    limit_req zone=skyfleet_api burst=20 nodelay;
    limit_conn skyfleet_per_ip 20;
    proxy_pass http://demo_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 240s;
  }
  location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
  location / {
    limit_req zone=skyfleet_page burst=40 nodelay;
    limit_conn skyfleet_per_ip 20;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-store';
  }
}
